name: tests

# The fast suite: no Manim, no LaTeX, no ffmpeg. `pyproject.toml` sets
# `addopts = -m 'not smoke'`, so the live-render tests are deselected here and
# run on a schedule instead (see smoke.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.10"`; 3.13 is the newest release the package
        # claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The package itself has no runtime deps, so `.[dev]` is pytest and
        # nothing else. numpy is in no extra, yet `tests/test_cone_slice.py`
        # imports it at module scope and fails collection without it — so it is
        # named here rather than inherited from the `render` extra, which is the
        # heavyweight thing this job exists to avoid.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy

      - name: Pytest
        run: python -m pytest -q
