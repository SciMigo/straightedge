name: tests

# The fast suite: no Manim, no LaTeX, no ffmpeg. `pyproject.toml` sets
# `addopts = -m 'not smoke'`, so the live-render tests are deselected here and
# run on a schedule instead (see smoke.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.10"`; 3.13 is the newest release the package
        # claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # `dev` is the fast suite's complete environment: pytest, numpy for the
        # cone-slice checks, and the MCP SDK for the server-surface checks. The
        # heavyweight render and STT dependencies remain in their own extras.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q
