name: tests

# The fast suite: no Manim, no LaTeX, no ffmpeg. `pyproject.toml` sets
# `addopts = -m 'not smoke'`, so the live-render tests are deselected here and
# run on a schedule instead (see smoke.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.10"`; 3.13 is the newest release the package
        # claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # `dev` is the fast suite's complete environment: pytest, numpy for the
        # cone-slice checks, and the MCP SDK for the server-surface checks. The
        # heavyweight render and STT dependencies remain in their own extras.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q

  # CONTRIBUTING.md tells contributors the suite is process-parallel safe.
  # Nothing enforced that, so a test that began writing a shared path, or
  # depending on another's ordering, would have broken `-n auto` for everyone
  # while CI stayed green.
  #
  # A job of its own rather than a step guarded by
  # `if: matrix.python-version == '3.12'`: a guarded step stops running the day
  # that version leaves the matrix, and stops silently, which is the failure
  # this job exists to prevent happening one level up. One version is enough --
  # what it catches is coupling between tests, and an interpreter release does
  # not change that -- and the matrix above still runs every version serially.
  parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest across every core
        run: python -m pytest -q -n auto
