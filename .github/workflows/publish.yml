name: publish

# Publishes to PyPI on a version tag, via Trusted Publishing: PyPI verifies a
# short-lived OIDC token minted by this workflow instead of a stored API token,
# so there is no long-lived secret in the repo to leak or rotate. The trust is
# pinned on PyPI's side to (owner, repo, workflow filename, environment) — all
# four of which must match the registered record, so renaming *this file* or the
# `pypi` environment below breaks releases until that record is updated to match.
#
# A tag push always publishes to real PyPI. A manual run defaults to `dryrun`:
# it builds, checks the metadata, and verifies the artifact handoff between the
# two jobs, then stops without uploading. That makes the release path repeatable
# without burning a version number, which can never be reused once published.
#
# `testpypi` is offered for a full rehearsal including the upload, but TestPyPI
# is a separate instance with its own trusted-publisher registry — it needs its
# own pending-publisher record (same owner/repo/workflow, environment
# `testpypi`) and the PyPI one does not carry over. Without that record the
# upload fails with `invalid-publisher`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "dryrun builds and verifies without uploading"
        type: choice
        default: dryrun
        options: [dryrun, testpypi, pypi]

permissions:
  contents: read

# Two tags pushed together must not race for the same version slot.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Build once and hand the exact artifacts to the publish job. Rebuilding in
  # the publishing job would mean shipping bytes no test ever saw.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      sha256: ${{ steps.checksums.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata renders
        # Catches a README that PyPI would reject *before* the upload burns the
        # version number — a released version can never be re-uploaded.
        run: python -m twine check dist/*

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with `version` in pyproject.toml would publish
        # something no one can find by the name they tagged. Only a tag push
        # has a version to check; a manual run is building from a branch.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaged version $built"
            exit 1
          fi
          echo "tag and package agree on $built"

      - name: Record checksums
        # Passed to the publish job as an output rather than written into
        # `dist/`, because the publish action uploads everything in that
        # directory and would choke on a file that is not a distribution.
        id: checksums
        run: |
          sums=$(cd dist && sha256sum -- * | sort)
          echo "$sums"
          echo "sha256<<EOF" >> "$GITHUB_OUTPUT"
          echo "$sums" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Named on the index's pending-publisher record, and the hook for a
    # required-reviewer rule in repo settings if you ever want a human to
    # approve the push. A tag always means real PyPI; a manual run uses the
    # chosen target.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'pypi' || inputs.target }}
      url: ${{ startsWith(github.ref, 'refs/tags/') && 'https://pypi.org/project/straightedge/' || '' }}

    permissions:
      # The whole point: mint the OIDC token the index checks. Without this the
      # publish fails closed rather than falling back to a password.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify the artifacts survived the handoff
        # upload-artifact and download-artifact are on different majors (v7 and
        # v8). They are meant to interoperate, but "meant to" is not evidence,
        # and a corrupted or re-encoded distribution would otherwise be caught
        # by nobody until it was already on the index.
        run: |
          echo "expected:"; echo "${{ needs.build.outputs.sha256 }}"
          actual=$(cd dist && sha256sum -- * | sort)
          echo "actual:"; echo "$actual"
          if [ "$actual" != "${{ needs.build.outputs.sha256 }}" ]; then
            echo "::error::artifacts changed between the build and publish jobs"
            exit 1
          fi
          echo "handoff verified — bytes identical"

      - name: Dry run — stopping before the upload
        if: inputs.target == 'dryrun'
        run: echo "::notice::built, checked, and handoff verified; no upload attempted"

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — the action detects the OIDC token from the
        # `id-token: write` permission above and exchanges it with the index.
        if: inputs.target != 'dryrun'
        with:
          repository-url: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
