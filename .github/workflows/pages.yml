name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publishes the gallery in `site/` to https://scimigo.github.io/straightedge/.
    # Pages is configured to build from Actions rather than from a branch, so
    # this workflow is the only thing that updates the site.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # `tests.yml` runs this too, but both workflows fire on the same push to
      # main and run in parallel — so the deploy could publish a stale feed
      # before the test failed. Checking here as well is what makes the two
      # orderings equivalent. Pure stdlib, so it needs no setup step.
      - name: The Atom feed matches the posts
        run: python3 tools/build_blog_feed.py --check

      - name: Upload gallery
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
