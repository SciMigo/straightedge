name: smoke

# `pytest -m smoke` renders one real scene per builder through Manim. That is
# what catches the breakage `ast.parse` cannot see — LaTeX compile errors in
# MathTex strings, Manim primitive signature changes, missing CJK glyphs — and
# most of it arrives from upstream rather than from a commit here, so this runs
# on a clock rather than per push. Roughly 5 minutes of render locally; budget
# more on a shared runner.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System dependencies
        # texlive-latex-base:        latex, amsmath, babel
        # texlive-latex-extra:       standalone.cls, and pulls preview.sty
        # texlive-fonts-recommended: Type 1 Computer Modern for dvisvgm
        # dvisvgm:                   Manim's DVI -> SVG step
        # ffmpeg:                    video muxing
        # fonts-noto-cjk:            Chinese labels; without it Pango draws
        #                            blank boxes and the render still "passes"
        # cairo/pango headers:       pycairo has no manylinux wheel and builds
        #                            from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcairo2-dev libpango1.0-dev \
            ffmpeg dvisvgm \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-cjk

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render,dev]'

      - name: Report the toolchain
        # Version drift upstream is the usual cause of a red run here, so record
        # what was actually installed before anything renders.
        run: |
          python -c "import manim; print('manim', manim.__version__)"
          latex --version | head -1
          dvisvgm --version
          ffmpeg -version | head -1
          fc-list :lang=zh family | sort -u | head

      - name: Pytest -m smoke
        run: python -m pytest -m smoke -q

      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-media
          path: |
            /tmp/pytest-of-runner/**/media/**
          if-no-files-found: ignore
          retention-days: 7
