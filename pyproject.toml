[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "straightedge"
# Read from `straightedge.__version__` rather than restated here. One literal,
# so the packaged metadata, the CLI, and the version the MCP server advertises
# to clients cannot drift apart at a release.
dynamic = ["version"]
description = "Generate deterministic, machine-checkable SVG diagrams and Manim animations from structured data, templates, or a prompt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SciMigo" }]
maintainers = [{ name = "SciMigo" }]
# The name carries no keyword SEO of its own; the recovery is here and in the
# GitHub topics.
keywords = [
    "manim", "svg", "math", "animation", "diagram", "visualization",
    "education", "llm", "agents", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
# Deliberately empty. The SVG lane in `straightedge.diagrams` is pure stdlib, so
# a caller that only wants figures pays nothing for the video lane: Manim lives
# behind the `render` extra and is imported nowhere outside it.
dependencies = []

[project.urls]
Repository = "https://github.com/SciMigo/straightedge"
Issues = "https://github.com/SciMigo/straightedge/issues"

# Until now the CLI was only reachable as `python3 -m math_voice.cli`, which is
# not a surface a released package can ask people to use.
[project.scripts]
straightedge = "straightedge.cli:main"
straightedge-mcp = "straightedge.mcp_server:main"

[project.optional-dependencies]
render = ["manim>=0.19"]
stt = ["faster-whisper>=1.1"]
# The MCP server (straightedge.mcp_server) — an optional way to drive the library
# from an agent over the Model Context Protocol. The SDK is imported lazily, so
# the package works without it; only the server needs this.
mcp = ["mcp>=2.0"]
# Everything the fast test suite imports belongs here. Keep this separate from
# `render` and `stt`, whose heavyweight/runtime dependencies are not needed in
# the per-PR job. MCP must be present so its `importorskip`-guarded tests run.
#
# `sympy` is a *test oracle*, never a runtime path. The exact kernel in
# `straightedge.geometry.exact` is the one component whose bugs are silent — a
# sign function wrong in one branch returns a confident wrong number rather than
# raising, and would poison every geometric claim built on it while a suite of
# hand-picked identities stayed green. Cross-checking it against an independent
# CAS is what catches that; the shipped package still imports nothing but the
# standard library.
#
# Kept on one line because the declaration guard reads this assignment.
dev = ["pytest>=7.4", "numpy>=1.24", "mcp>=2.0", "sympy>=1.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
# `smoke` tests invoke Manim to render every scene builder. Slow (~minutes
# total) but catch what ast.parse can't: LaTeX compile errors, primitive
# signature mismatches, dimension errors. Excluded by default; opt in with
# `pytest -m smoke` (and `pytest -m 'smoke or not smoke'` to run everything).
addopts = "-m 'not smoke'"
markers = [
    "smoke: live Manim render of one scene per builder; slow, opt-in via -m smoke",
]

[tool.setuptools.dynamic]
version = { attr = "straightedge.__version__" }

[tool.setuptools.packages.find]
include = ["straightedge*"]

# Ship the PEP 561 marker so a type-checker trusts the annotations rather than
# treating the installed package as untyped.
[tool.setuptools.package-data]
straightedge = ["py.typed"]
