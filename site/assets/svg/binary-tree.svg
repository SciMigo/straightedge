<svg xmlns="http://www.w3.org/2000/svg" width="428" height="238" viewBox="0 0 428 238" class="diagram">
<style>
.diagram-point { fill: #666; }
.diagram-point-visible { fill: #4CAF50; }
.diagram-point-hidden { fill: #ccc; }
.diagram-point-origin { fill: #2196F3; }
.diagram-point-highlight { fill: #FF9800; }
.diagram-ray { stroke: #999; stroke-width: 1; stroke-dasharray: 4,2; fill: none; }
.diagram-axis { stroke: #333; stroke-width: 2; fill: none; }
.diagram-grid { stroke: #eee; stroke-width: 1; fill: none; }
.diagram-label { font-size: 12px; font-family: sans-serif; fill: #333; }
.diagram-label-small { font-size: 10px; font-family: sans-serif; fill: #666; }

.tree-node { stroke: #343a40; stroke-width: 1.5; fill: #f8f9fa; }
.tree-node-current { fill: #fff3cd; }
.tree-node-visited { fill: #d1ecf1; }
.tree-node-target { fill: #d4edda; }
.tree-node-found { fill: #d4edda; }
.tree-node-invalid { fill: #f8d7da; }
.tree-node-rejected { fill: #f8d7da; }
.tree-node-comparison { fill: #FF9800; }
.tree-node-value { font-size: 13px; font-family: sans-serif; fill: #212529; }
.tree-edge { stroke: #555; }
.tree-edge-path { stroke: #9C27B0; stroke-width: 2.5; }
.tree-pointer-label { font-size: 12px; font-family: sans-serif; font-weight: 600; }
.tree-annotation { font-size: 12px; font-family: sans-serif; fill: #444; }
.tree-caption { font-size: 13px; font-family: sans-serif; fill: #333; }
</style>
<defs>
<marker id="tree-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
</marker>
</defs>
<line x1="100" y1="110" x2="30" y2="190" stroke="#555" stroke-width="2" class="tree-edge"/>
<line x1="100" y1="110" x2="170" y2="190" stroke="#555" stroke-width="2" class="tree-edge tree-edge-path"/>
<line x1="240" y1="30" x2="100" y2="110" stroke="#555" stroke-width="2" class="tree-edge tree-edge-path"/>
<line x1="240" y1="30" x2="310" y2="110" stroke="#555" stroke-width="2" class="tree-edge"/>
<line x1="310" y1="110" x2="380" y2="190" stroke="#555" stroke-width="2" class="tree-edge"/>
<circle cx="30" cy="190" r="18" class="tree-node tree-node-default"/>
<text x="30" y="195" class="tree-node-value" text-anchor="middle">1</text>
<circle cx="100" cy="110" r="18" class="tree-node tree-node-default"/>
<text x="100" y="115" class="tree-node-value" text-anchor="middle">3</text>
<circle cx="170" cy="190" r="18" class="tree-node tree-node-current"/>
<text x="170" y="195" class="tree-node-value" text-anchor="middle">6</text>
<circle cx="240" cy="30" r="18" class="tree-node tree-node-visited"/>
<text x="240" y="35" class="tree-node-value" text-anchor="middle">8</text>
<circle cx="310" cy="110" r="18" class="tree-node tree-node-default"/>
<text x="310" y="115" class="tree-node-value" text-anchor="middle">10</text>
<circle cx="380" cy="190" r="18" class="tree-node tree-node-default"/>
<text x="380" y="195" class="tree-node-value" text-anchor="middle">14</text>
<line x1="170" y1="154" x2="170" y2="172" stroke="#2196F3" stroke-width="2" marker-end="url(#tree-arrow)" class="tree-pointer"/>
<text x="170" y="149" class="tree-pointer-label" text-anchor="middle" fill="#2196F3">current</text>
<line x1="240" y1="-10" x2="240" y2="12" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="240" y="-18" class="tree-annotation" text-anchor="middle">root</text>
</svg>
