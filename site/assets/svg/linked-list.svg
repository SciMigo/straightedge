<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" class="diagram">
<style>
.diagram-point { fill: #666; }
.diagram-point-visible { fill: #4CAF50; }
.diagram-point-hidden { fill: #ccc; }
.diagram-point-origin { fill: #2196F3; }
.diagram-point-highlight { fill: #FF9800; }
.diagram-ray { stroke: #999; stroke-width: 1; stroke-dasharray: 4,2; fill: none; }
.diagram-axis { stroke: #333; stroke-width: 2; fill: none; }
.diagram-grid { stroke: #eee; stroke-width: 1; fill: none; }
.diagram-label { font-size: 12px; font-family: sans-serif; fill: #333; }
.diagram-label-small { font-size: 10px; font-family: sans-serif; fill: #666; }

.linked-node { stroke: #343a40; stroke-width: 1.2; fill: #f8f9fa; }
.linked-node-current { fill: #fff3cd; }
.linked-node-visited { fill: #d1ecf1; }
.linked-node-target { fill: #d4edda; }
.linked-node-found { fill: #d4edda; }
.linked-node-invalid { fill: #f8d7da; }
.linked-node-rejected { fill: #f8d7da; }
.linked-node-comparison { fill: #FF9800; }
.linked-node-value { font-size: 14px; font-family: sans-serif; fill: #212529; }
.linked-node-pointer-dot { fill: #212529; }
.linked-pointer-label { font-size: 12px; font-family: sans-serif; font-weight: 600; }
.linked-null-label { font-size: 12px; font-family: sans-serif; fill: #6c757d; }
.linked-caption { font-size: 13px; font-family: sans-serif; fill: #333; }
</style>
<defs>
<marker id="linked-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
</marker>
</defs>
<rect x="20" y="50" width="70" height="40" class="linked-node linked-node-visited"/>
<line x1="60" y1="50" x2="60" y2="90" stroke="#343a40" stroke-width="1.2"/>
<text x="40.0" y="75.0" class="linked-node-value" text-anchor="middle">A</text>
<circle cx="75.0" cy="70.0" r="4" class="linked-node-pointer-dot"/>
<rect x="130" y="50" width="70" height="40" class="linked-node linked-node-visited"/>
<line x1="170" y1="50" x2="170" y2="90" stroke="#343a40" stroke-width="1.2"/>
<text x="150.0" y="75.0" class="linked-node-value" text-anchor="middle">B</text>
<circle cx="185.0" cy="70.0" r="4" class="linked-node-pointer-dot"/>
<rect x="240" y="50" width="70" height="40" class="linked-node linked-node-current"/>
<line x1="280" y1="50" x2="280" y2="90" stroke="#343a40" stroke-width="1.2"/>
<text x="260.0" y="75.0" class="linked-node-value" text-anchor="middle">C</text>
<circle cx="295.0" cy="70.0" r="4" class="linked-node-pointer-dot"/>
<rect x="350" y="50" width="70" height="40" class="linked-node linked-node-default"/>
<line x1="390" y1="50" x2="390" y2="90" stroke="#343a40" stroke-width="1.2"/>
<text x="370.0" y="75.0" class="linked-node-value" text-anchor="middle">D</text>
<circle cx="405.0" cy="70.0" r="4" class="linked-node-pointer-dot"/>
<line x1="90" y1="70.0" x2="130" y2="70.0" stroke="#333" stroke-width="2" marker-end="url(#linked-arrow)" class="linked-list-arrow"/>
<line x1="200" y1="70.0" x2="240" y2="70.0" stroke="#333" stroke-width="2" marker-end="url(#linked-arrow)" class="linked-list-arrow"/>
<line x1="310" y1="70.0" x2="350" y2="70.0" stroke="#333" stroke-width="2" marker-end="url(#linked-arrow)" class="linked-list-arrow"/>
<line x1="420" y1="70.0" x2="450" y2="70.0" stroke="#333" stroke-width="2" marker-end="url(#linked-arrow)" class="linked-list-arrow"/>
<text x="462" y="75.0" class="linked-null-label">null</text>
<line x1="275.0" y1="30" x2="275.0" y2="50" stroke="#2196F3" stroke-width="2" marker-end="url(#linked-arrow)" class="linked-pointer"/>
<text x="275.0" y="25" class="linked-pointer-label" text-anchor="middle" fill="#2196F3">slow</text>
</svg>
